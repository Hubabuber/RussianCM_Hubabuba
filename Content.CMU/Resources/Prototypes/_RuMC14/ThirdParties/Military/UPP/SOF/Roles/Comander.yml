- type: job
  parent: CMJobBase
  id: RuMCUPPSOFCommander
  roundSide: ThirdParty
  roundForce: UPP
  roundRole: RuMCUPPSOFCommander
  roundComponents:
  - type: TacticalMapIcon
    icon:
      sprite: /Textures/_RMC14/Interface/map_blips.rsi
      state: spp_sl_a
  - type: AssignSquad
    whitelist:
      tags:
      - RuMCSquadSOF
  - type: Skills
    skills:
      RMCSkillCqc: 2
      RMCSkillPowerLoader: 1
      RMCSkillEngineer: 2
      RMCSkillConstruction: 2
      RMCSkillFirearms: 2
      RMCSkillMeleeWeapons: 3
      RMCSkillMedical: 1
      RMCSkillPilot: 1
      RMCSkillPolice: 2
      RMCSkillFireman: 1
      RMCSkillVehicles: 2
      RMCSkillJtac: 2
      RMCSkillEndurance: 3
      RMCSkillLeadership: 2
  - type: EquipEntityPreset
    preset: RuMCSOFOfficerPreset
  - type: JobPrefix
    prefix: rumc-job-prefix-commander
  - type: MarineOrders
  - type: RMCTrackable
  - type: RMCPointing
  - type: Language
    spokenLanguages:
    - Polish
    - English
    - Russian
    - Spanish
    - Mandarin
    - German
    understoodLanguages:
    - Polish
    - English
    - Russian
    - Spanish
    - Mandarin
    - German
    currentLanguage: Russian
    defaultLanguage: Russian

  name: Commander
  description: SOF Commander
  playTimeTracker: RuMCJobUPPSOFCommander
  ranks:
    RMCRankCivilian: []
  chevrons:
    chevrons:
    UPP_Plutonowy:
      entity: AU14ChevronUPPNIPlutonowy
      requirements: []
    UPP_Sergeant:
      entity: AU14ChevronUPPNISergeant
      requirements:
      - !type:RoleTimeRequirement
        role: RuMCJobUPPSOFCommander
        time: 1800 # 0.5 hours
    UPP_SeniorSergeant:
      entity: AU14ChevronUPPNISeniorSergeant
      requirements:
      - !type:RoleTimeRequirement
        role: RuMCJobUPPSOFCommander
        time: 5400 # 1.5 hours
    UPP_JuniorLieutenant:
      entity: AU14ChevronUPPNIJuniorLieutenant
      requirements:
      - !type:RoleTimeRequirement
        role: RuMCJobUPPSOFCommander
        time: 7200 # 2 hours
    UPP_Lieutenant:
      entity: AU14ChevronUPPNILieutenant
      requirements:
      - !type:RoleTimeRequirement
        role: RuMCJobUPPSOFCommander
        time: 10800 # 3 hours
  spawnMenuRoleName: SOF Commander
  startingGear: RuMCGearUPPSOFbaseCOM
  greeting: rumc-SOF-greeting
  icon: "RuMCJobIconUPPSOFCommander"
  joinNotifyCrew: false
  supervisors: au14-job-supervisors-govfor
  accessGroups:
  - AU14GovforSquad
  hidden: false

- type: entity
  parent: RuMCBaseMobSpeciesOrganicUPPSOF
  id: RuMCJobUPPSOFCommander
  name: SOF Commander
  components:
  - type: EquipEntityPreset
    preset: RuMCSOFOfficerPreset
  - type: GhostTakeoverAvailable
  - type: GhostRoleApplySpecial
    squad: RuMCSquadSOF
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: SOF Commander
    description: You are part of a UPP! Not one step back!
    job: RuMCUPPSOFCommander
    raffle:
      settings: short

- type: startingGear
  parent: RuMCGearUPPSOFbaseLigth
  id: RuMCGearUPPSOFbaseCOM
  equipment:
    id: RuCMIDCardUPPSOFCommander
    ears: RuMCHeadsetSOF
  storage:
    back:
    - RuMCirpUPP
    - AU14PacketGrenadeHighExplosiveUPPFilled
    - AU14GrenadeSmokeUPP
    - RMCExplosiveBreachingCharge
    - RMCDrinkAlcoholVodka
    - RMCDrinkAlcoholVodka
  inhand:
    - RuMCirpUPP

- type: jobIcon
  parent: CMJobIconBase
  id: RuMCJobIconUPPSOFCommander
  icon:
    sprite: _RMC14/Interface/cm_job_icons.rsi
    state: upp_sl_a

# Time tracker

- type: playTimeTracker
  id: RuMCJobUPPSOFCommander
